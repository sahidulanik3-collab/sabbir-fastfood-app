<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- POS Terminal Base Stand -->
  <path d="M 176 390 L 336 390 L 320 440 L 192 440 Z" fill="#022c22" opacity="0.6" />
  <rect x="160" y="430" width="192" height="18" rx="9" fill="url(#goldGrad)" />

  <!-- POS Terminal Screen Body -->
  <rect x="116" y="120" width="280" height="250" rx="32" fill="#0f172a" />
  <rect x="132" y="136" width="248" height="175" rx="20" fill="#1e293b" />

  <!-- Screen Content: Modern M with Cash Register Graph -->
  <path d="M 160 270 L 160 170 L 210 230 L 256 170 L 302 230 L 352 170 L 352 270" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Status / NFC Pay Wave Badge -->
  <circle cx="345" cy="165" r="12" fill="#10b981" />

  <!-- Terminal Button Bar / Card Slot -->
  <rect x="144" y="328" width="130" height="18" rx="9" fill="#334155" />
  <circle cx="300" cy="337" r="10" fill="#22c55e" />
  <circle cx="330" cy="337" r="10" fill="#eab308" />
  <circle cx="360" cy="337" r="10" fill="#ef4444" />

  <!-- Badge banner: "POS" -->
  <g transform="translate(256, 92)">
    <rect x="-85" y="-36" width="170" height="48" rx="24" fill="url(#goldGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
    <text x="0" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">MANAGER</text>
  </g>
</svg>
